<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Sistem Bank Sampah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #eee;
        }
        .error-card {
            background: #16213e;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border: 1px solid #0f3460;
        }
        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #e94560;
            line-height: 1;
        }
        .error-title {
            font-size: 22px;
            margin: 16px 0 8px;
            color: #ffffff;
        }
        .error-message {
            font-size: 14px;
            color: #a0a0b0;
            margin-bottom: 32px;
        }
        .btn-back {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-back:hover { background: #c73652; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code" th:text="${errorCode} ?: '500'">500</div>
        <div class="error-title" th:text="${errorTitle} ?: 'Terjadi Kesalahan'">Terjadi Kesalahan</div>
        <div class="error-message" th:text="${errorMessage} ?: 'Sistem mengalami gangguan. Silakan coba lagi.'">
            Sistem mengalami gangguan.
        </div>
        <a href="javascript:history.back()" class="btn-back">← Kembali</a>
    </div>
</body>
</html>
